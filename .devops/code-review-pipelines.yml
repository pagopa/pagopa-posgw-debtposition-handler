variables:
  BRANCH_NAME: $[ replace(variables['System.PullRequest.SourceBranch'], 'refs/heads/', '') ]
  GRADLE_USER_HOME: $(Pipeline.Workspace)/.gradle
trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest


resources:
  repositories:
    - repository: pagopaPosgwLocal
      type: github
      name: pagopa/pagopa-posgw-local
      ref: main
      endpoint: 'io-azure-devops-github-ro'

stages:
  - stage: BuildEndUnitTest
    jobs:
      - job: make_buildEndUnitTest
        steps:
          - task: Cache@2
            inputs:
              key: 'gradle | "$(Agent.OS)" | **/build.gradle.kts' # Swap build.gradle.kts for build.gradle when using Groovy
              restoreKeys: |
                gradle | "$(Agent.OS)"
                gradle
              path: $(GRADLE_USER_HOME)
            displayName: Configure gradle caching

          - task: SonarCloudPrepare@3
            displayName: 'Prepare SonarCloud analysis configuration'
            inputs:
              SonarCloud: '$(SONARCLOUD_SERVICE_CONN)'
              organization: '$(SONARCLOUD_ORG)'
              scannerMode: Other
              extraProperties: |
                sonar.projectKey=$(SONARCLOUD_PROJECT_KEY)
                sonar.projectName=$(SONARCLOUD_PROJECT_NAME)
                sonar.coverage.exclusions=**/config/*,**/*Mock*,**/model/*
                sonar.coverage.jacoco.xmlReportPaths=./build/reports/jacoco/test/jacocoTestReport.xml
                sonar.junit.reportPaths=./build/test-results/test

          - task: Gradle@3
            inputs:
              gradleWrapperFile: 'gradlew' # string. Alias: wrapperScript. Required. Gradle wrapper. Default: gradlew.
              tasks: 'build' # string. Required. Tasks. Default: build.
              publishJUnitResults: true
              testResultsFiles: '**/TEST-*.xml' # string. Required when publishJUnitResults = true. Test results files. Default: **/TEST-*.xml.
              codeCoverageToolOption: 'None' # 'None' | 'Cobertura' | 'JaCoCo'. Alias: codeCoverageTool. Code coverage tool. Default: None.
              codeCoverageClassFilesDirectories: 'build/classes/main/' # string. Alias: classFilesDirectories. Required when codeCoverageTool != None. Class files directories. Default: build/classes/main/.
              javaHomeOption: 'JDKVersion' # 'JDKVersion' | 'Path'. Alias: javaHomeSelection. Required. Set JAVA_HOME by. Default: JDKVersion.
              jdkVersionOption: '1.21' # 'default' | '1.11' | '1.10' | '1.9' | '1.8' | '1.7' | '1.6'. Alias: jdkVersion. Optional. Use when javaHomeSelection = JDKVersion. JDK version. Default: default.
              sonarQubeRunAnalysis: true
              sqGradlePluginVersionChoice: 'specify'
              sonarQubeGradlePluginVersion: '7.4.0.8496'
            env:
              GITHUB_TOKEN: $(GITHUB_RO_TOKEN)

          - task: SonarCloudPublish@3
            displayName: 'Publish SonarCloud results on build summary'
            inputs:
              pollingTimeoutSec: '300'
          - script: |
              # stop the Gradle daemon to ensure no files are left open (impacting the save cache operation later)
              ./gradlew --stop
            displayName: Gradlew stop

          - task: PublishCodeCoverageResults@2
            inputs:
              codeCoverageTool: 'JaCoCo'
              summaryFileLocation: 'build/reports/jacoco/test/jacocoTestReport.xml'
              reportDirectory: 'build/reports/jacoco/test/html'
            displayName: 'Publish Code Coverage on Azure Devops'

  - stage: IntegrationTest
    dependsOn: [ ]
    jobs:
      - job: make_integration_test
        steps:
          - checkout: self
            path: s/debtposition-handler
          - checkout: pagopaPosgwLocal
            path: s/posgw-local
          - script: |
              echo "##[debug] Change placeholder for posgw-debtposition-handler set branch: $(BRANCH_NAME)"
              [ -z "$(BRANCH_NAME)" ] || sed -i "s|^POSGW_DEBTPOSITION_HANDLER_GIT_REF=.*$|POSGW_DEBTPOSITION_HANDLER_GIT_REF=$(BRANCH_NAME)|" .env
            displayName: 'Change debtposition-handler branch name in posgw-local .env'
            workingDirectory: posgw-local
          - script: docker compose up pagopa-posgw-debtposition-handler -d
            displayName: 'Run app with docker-compose'
            workingDirectory: posgw-local
            env:
              GITHUB_TOKEN: $(GITHUB_RO_TOKEN)
          - script: |
              timeout 180 bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' localhost:8081/actuator/health/liveness)" != "200" ]]; do sleep 5; done' || exit 1
            displayName: 'Health check'
          - script: yarn global add newman
            displayName: 'newman installation'
          - script: newman run api-tests/code-review/debtposition-handler-local.tests.json --environment=api-tests/code-review/debtposition-handler-local.env.json --reporters cli,junit --reporter-junit-export Results/debtposition-handler-TEST.xml
            displayName: 'Run api test for debtposition-handler'
            workingDirectory: debtposition-handler
          - task: PublishTestResults@2
            inputs:
              testResultsFormat: 'JUnit'
              testResultsFiles: '**/*-TEST.xml'
              searchFolder: debtposition-handler
          - script: |
              echo "Printing logs for all running containers:"
              for container in $(docker ps -q); do
                name=$(docker inspect --format='{{.Name}}' $container | sed 's/^\/\(.*\)/\1/')
                echo "===== Logs for $name ====="
                docker logs $container
                echo "===== End of logs for $name ====="
              done
            condition: always()
            displayName: 'Print Docker container logs'