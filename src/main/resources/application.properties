#spring.application.name=pagopa-posgw-debtposition-handler
application.name=${name}
build.version=${version}
# Logging
logging.level.root=\${ROOT_LOGGING_LEVEL:INFO}
logging.level.it.pagopa=\${APP_LOGGING_LEVEL:INFO}
logging.level.web=\${WEB_LOGGING_LEVEL:INFO}
spring.profiles.active=\${ACTIVE_PROFILE:local}
# Spring redis data
spring.data.redis.host=\${REDIS_HOST:localhost}
spring.data.redis.port=\${REDIS_PORT:6379}
spring.data.redis.password=\${REDIS_PASSWORD:}
spring.data.redis.timeout=\${REDIS_TIMEOUT:2000ms}
# GPD Service
gpd.uri=\${GPD_URI}
gpd.readTimeout=\${GPD_TIMEOUT}
gpd.connectionTimeout=\${GPD_CONNECTION_TIMEOUT}
gpd.apiKey=\${GPD_API_KEY}
# Notice Number(NAV) Generator library parameters
notice.number.aux-digit=\${NOTICE_NUMBER_AUX_DIGIT:3}
notice.number.segregation-code=\${NOTICE_NUMBER_SEGREGATION_CODE:3}
notice.number.redis-key-prefix=\${NOTICE_NUMBER_REDIS_KEY_PREFIX:"iuv:lock:"}
notice.number.lock-millis=\${NOTICE_NUMBER_LOCK_TTL:2000}
notice.number.max-retries=\${NOTICE_NUMBER_MAX_RETRIES:3}