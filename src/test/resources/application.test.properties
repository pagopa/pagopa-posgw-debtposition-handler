# GPD Service
gpd.uri=http://localhost:3002
gpd.readTimeout=1000
gpd.connectionTimeout=1000
gpd.apiKey=primary-key

# Spring redis data
spring.data.redis.host=\${REDIS_HOST:localhost}
spring.data.redis.port=\${REDIS_PORT:6379}
spring.data.redis.password=\${REDIS_PASSWORD:}
spring.data.redis.timeout=\${REDIS_TIMEOUT:2000ms}

# Notice Number(NAV) Generator library parameters
notice.number.aux-digit=\${NOTICE_NUMBER_AUX_DIGIT:3}
notice.number.segregation-code=\${NOTICE_NUMBER_SEGREGATION_CODE:3}
notice.number.redis-key-prefix=\${NOTICE_NUMBER_REDIS_KEY_PREFIX:"iuv:lock:"}
notice.number.lock-millis=\${NOTICE_NUMBER_LOCK_TTL:2000}
notice.number.max-retries=\${NOTICE_NUMBER_MAX_RETRIES:3}
